spring.application.name=interview-prep-backend
server.port=${PORT:8080}

# MySQL. For local development, set these environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/interview_prep}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Comma-separated frontend origins. Example:
# FRONTEND_URL=http://localhost:5173,https://your-frontend.example
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

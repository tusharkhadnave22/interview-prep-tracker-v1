spring.application.name=interview-prep-backend
server.port=${PORT:8080}

# MySQL Configuration
# For Render deployment, use PostgreSQL instead (MySQL is also supported)
# Local: localhost:3306
# Render: Use connection string from Render PostgreSQL service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/interview_prep}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration - Allow frontend from any origin
# Update FRONTEND_URL in production deployment
# Example: http://localhost:5173,https://your-frontend.vercel.app
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# File Upload Settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
